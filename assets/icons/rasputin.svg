<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rasputin Instrumental">
  <defs>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded -->
  <rect width="96" height="96" rx="22" fill="#0a0a1a" stroke="url(#vinylGrad)" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Vinyl record -->
  <g transform="translate(48 42)">
    <circle r="28" fill="#111113" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <circle r="26" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>
    <circle r="22" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="0.5"/>
    <circle r="18" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="0.5"/>
    <!-- label -->
    <circle r="9" fill="url(#labelGrad)"/>
    <circle r="2.5" fill="#0a0a1a" stroke="white" stroke-opacity="0.9" stroke-width="0.8"/>
    <!-- shine -->
    <path d="M -18 -18 Q -8 -22  -6 -10 Q -14 -6 -18 -18" fill="white" opacity="0.08"/>
  </g>
  <!-- top funk badge -->
  <g transform="translate(48 18)">
    <rect x="-22" y="-8" width="44" height="16" rx="8" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.08"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#a78bfa" letter-spacing="0.8">FUNK</text>
  </g>
  <!-- tiny note -->
  <g transform="translate(78 18)" opacity="0.9">
    <text font-size="10" fill="white">🎵</text>
  </g>
</svg>