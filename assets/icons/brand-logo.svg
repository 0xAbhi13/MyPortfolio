<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="0xAbhi13 Brand">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a103a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#6d28d9" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="0" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App icon background — premium rounded square -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="1.2"/>
  <!-- subtle grid -->
  <g opacity="0.035" stroke="white" stroke-width="0.6">
    <path d="M32 56 L224 56 M32 96 L224 96 M32 160 L224 160 M32 200 L224 200 M56 32 L56 224 M96 32 L96 224 M160 32 L160 224 M200 32 L200 224"/>
  </g>
  <!-- Brand mark — NOT text — abstract 0x + code brackets forming A -->
  <g filter="url(#innerGlow)">
    <!-- outer hex / bracket container -->
    <path d="M128 52 L182 84 L182 148 L128 180 L74 148 L74 84 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
    <!-- inner A — formed by code brackets -->
    <!-- left leg = < shape -->
    <path d="M106 148 L88 128 L106 108 L112 114 L98 128 L112 142 Z" fill="url(#iconGrad)"/>
    <!-- right leg = > shape -->
    <path d="M150 148 L168 128 L150 108 L144 114 L158 128 L144 142 Z" fill="url(#iconGrad)"/>
    <!-- crossbar = terminal line with 0x dot -->
    <rect x="102" y="124" width="52" height="6" rx="3" fill="url(#iconGrad)"/>
    <!-- central 0x pulse dot — hex concept -->
    <circle cx="128" cy="98" r="10" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <circle cx="128" cy="98" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- tiny x inside 0 -->
    <g stroke="#0a0a1a" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
      <path d="M126 96 L130 100"/>
      <path d="M130 96 L126 100"/>
    </g>
  </g>
  <!-- bottom accent line -->
  <rect x="88" y="196" width="80" height="2.5" rx="1.25" fill="url(#accentGrad)" opacity="0.9"/>
  <!-- not text — pure icon, no ABHI letters -->
</svg>
