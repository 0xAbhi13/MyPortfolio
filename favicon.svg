<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="0xAbhi13 — Abhishek Portfolio">
  <title>0xAbhi13</title>
  <desc>Premium brand favicon for 0xAbhi13 — abstract AB monogram with code-inspired geometry</desc>
  <defs>
    <linearGradient id="brandG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
