    </linearGradient>
    <filter id="brandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Premium rounded app shape — geometric, not text-dependent -->
