  <rect x="0.7" y="0.7" width="30.6" height="30.6" rx="6.8" fill="none" stroke="white" stroke-opacity="0.10"/>
  <rect width="32" height="32" rx="7.5" fill="url(#innerHighlight)" opacity="0.9"/>

  <!-- Abstract AB monogram — bold geometric A formed by two diagonal bars + code-inspired crossbar -->
  <!-- Left leg of A -->
  <path d="M 9.2 24.2 L 15.1 8.2 Q 15.6 7.0 16.6 7.0 Q 17.6 7.0 18.1 8.2 L 24.0 24.2 Q 24.5 25.5 23.4 26.2 Q 22.9 26.5 22.2 26.5 L 21.1 26.5 L 18.9 20.8 L 14.3 20.8 L 12.1 26.5 L 11.0 26.5 Q 10.3 26.5 9.8 26.2 Q 8.7 25.5 9.2 24.2 Z" fill="white" fill-opacity="0.98"/>
  <!-- Crossbar — code bracket inspired, subtle 0x hint via negative space -->
  <path d="M 13.2 18.1 L 14.6 14.6 L 18.6 14.6 L 20.0 18.1 Z" fill="#0a0a1a" opacity="0.92"/>
  <path d="M 14.8 16.8 L 15.4 15.2 L 17.8 15.2 L 18.4 16.8 Z" fill="white" opacity="0.92"/>
  <!-- Subtle 0x dot — developer hint, geometric, not text -->
  <g opacity="0.95">
